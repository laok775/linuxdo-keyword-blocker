<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Linux.do Keyword Blocker</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <div>
          <h1>Linux.do 屏蔽词</h1>
          <p id="status">正在读取设置</p>
        </div>
        <label class="switch" title="启用或暂停屏蔽">
          <input id="enabled" type="checkbox">
          <span></span>
        </label>
      </header>

      <section class="field">
        <label for="keywordInput">关键词</label>
        <div class="add-row">
          <input id="keywordInput" type="text" autocomplete="off" placeholder="输入后回车">
          <button id="addKeyword" type="button">添加</button>
        </div>
      </section>

      <section class="toolbar" aria-label="匹配设置">
        <label>
          <span>匹配</span>
          <select id="matchMode">
            <option value="contains">包含关键词</option>
            <option value="wholeWord">完整词匹配</option>
          </select>
        </label>
        <label>
          <span>处理</span>
          <select id="hideMode">
            <option value="hide">直接隐藏</option>
            <option value="dim">淡化显示</option>
          </select>
        </label>
      </section>

      <section class="keywords" aria-label="当前关键词">
        <div id="emptyState" class="empty">还没有关键词</div>
        <ul id="keywordList"></ul>
      </section>

      <footer class="footer">
        <button id="clearAll" type="button" class="ghost">清空</button>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
